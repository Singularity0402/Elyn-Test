<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<rect width="1500" height="1000" fill="#f5f3ec"/>
<g font-family="Malgun Gothic, sans-serif" fill="#18352e">
<text x="80" y="85" font-size="22" letter-spacing="3">H2 / CONCEPT REVIEW / 2026.11.11</text>
<text x="80" y="150" font-size="46" font-weight="bold">덮개를 돌리면 필름 길이는 충분할까?</text>
<text x="80" y="196" font-size="23" fill="#596960">고정 힌지 · 앞 끝단 직결 · 신축 없음 · 추가 자유길이 없음이라는 가정</text>
<rect x="60" y="235" width="1380" height="530" rx="28" fill="white"/>
<path d="M240 650 L480 234.31" fill="none" stroke="#347db2" stroke-width="15" stroke-linecap="round"/>
<path d="M240 650 L720 650" fill="none" stroke="#adb8b0" stroke-width="3" stroke-dasharray="10 8"/>
<path d="M240 650 L480 650" fill="none" stroke="#c24f45" stroke-width="12"/>
<path d="M480 650 L720 650" fill="none" stroke="#538254" stroke-width="9" stroke-dasharray="9 6"/>
<path d="M480 650 L480 234.31" fill="none" stroke="#c98a25" stroke-width="5" stroke-dasharray="12 9"/>
<path d="M310 650 A70 70 0 0 0 275 589.38" fill="none" stroke="#347db2" stroke-width="3"/>
<g fill="#18352e"><circle cx="240" cy="650" r="9"/><circle cx="480" cy="650" r="9"/><circle cx="720" cy="650" r="9"/><circle cx="480" cy="234.31" r="9"/></g>
<text x="172" y="698" font-size="24">O 뒤 힌지</text>
<text x="445" y="698" font-size="24">P 박리점</text>
<text x="678" y="698" font-size="24">F 닫힌 앞 끝</text>
<text x="513" y="272" font-size="25" font-weight="bold">C 열린 앞 결합점</text>
<text x="258" y="424" font-size="25" fill="#347db2">강체 덮개</text>
<text x="538" y="469" font-size="24" fill="#a56a12">필요 길이 d</text>
<text x="530" y="619" font-size="23" fill="#3c713f">필름 길이 s</text>
<text x="285" y="619" font-size="20" fill="#b1463d">남은 밀봉</text>
<text x="312" y="575" font-size="20">θ</text>
<text x="870" y="325" font-size="26" font-weight="bold">정규화한 한 중간상태</text>
<text x="870" y="378" font-size="25">L = 1, x = 0.5, θ = 60°</text>
<text x="870" y="426" font-size="25">s = 0.500</text>
<text x="870" y="474" font-size="25">d ≈ 0.866</text>
<text x="870" y="535" font-size="29" fill="#b1463d" font-weight="bold">이 가정에서는 길이 부족</text>
<text x="870" y="591" font-size="21" fill="#596960">물리적 치수·힘·소재를 정한 값이 아님</text>
<text x="870" y="633" font-size="21" fill="#596960">실제 필름의 여유·신장·결합 변화는 미포함</text>
<text x="80" y="827" font-size="31" font-weight="bold">d² − s² = 2Lx(1 − cosθ) &gt; 0</text>
<text x="80" y="876" font-size="25">양의 개방각에서 부분박리를 함께 진행하려면 모델에 없는 자유도가 필요하다.</text>
<text x="80" y="926" font-size="23" fill="#596960">설계 검토도 / 축척·물성 없음 / 실물·공정·가열 검증 전 / 모든 덮개형 제품의 불가능성 증명이 아님</text>
</g></svg>