<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주석의 울음 - 서해 비축기지 배정 일지</title>
<style>
:root{
  --bg:#0f1318; --panel:#1a2028; --panel2:#232b35; --line:#3a4654; --ink:#f1f4f6; --sub:#b4c0cb;
  --steel:#cdd5db; --amber:#f2b84b; --paper:#ead9b5; --teal:#6fd3c8; --red:#f0766a; --green:#86dc98;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07090c;overflow:hidden;color:var(--ink);
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
#screen,#modal{position:absolute;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
svg{display:block}

/* ---------- 공통 ---------- */
.btn{background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 18px;font-size:17px;font-weight:700;color:var(--ink);transition:transform .08s,background .15s,border-color .15s}
.btn:hover:not(:disabled){background:#2d3744;border-color:#5b6b7d}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#241a05}
.btn.pri:hover:not(:disabled){background:#ffc965;border-color:#ffc965}
.btn.big{font-size:22px;padding:14px 30px;border-radius:12px}
.btn.sm{font-size:14px;padding:6px 12px;border-radius:8px}
.btn:disabled{opacity:.42}
.tg{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:5px;border:1px solid transparent;line-height:1.4}
.tg.amber{color:#ffd88a;background:rgba(242,184,75,.14);border-color:rgba(242,184,75,.45)}
.tg.teal{color:#a8ece4;background:rgba(111,211,200,.12);border-color:rgba(111,211,200,.45)}
.tg.red{color:#ffb0a8;background:rgba(240,118,106,.14);border-color:rgba(240,118,106,.5)}
.tg.gray{color:#b9c2cb;background:rgba(160,170,180,.14);border-color:rgba(160,170,180,.4)}
.tg.green{color:#b8f0c4;background:rgba(134,220,152,.12);border-color:rgba(134,220,152,.45)}
#toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:#0b0f13;border:1.5px solid var(--amber);color:var(--ink);
  padding:12px 22px;border-radius:12px;font-size:18px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:900px;text-align:center}
#toast.show{opacity:1}
#hud{position:absolute;right:14px;top:12px;z-index:40;display:flex;gap:8px}
#hud .btn{background:rgba(26,32,40,.82)}

/* ---------- 첫 화면 ---------- */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 46%,#1c2530 0%,#0f1318 62%)}
.title .q{font-size:26px;color:var(--sub);letter-spacing:.02em;margin-top:-6px;opacity:0;animation:fadein 1.2s .35s forwards}
.title .strip{width:760px;height:282px;margin-top:6px;touch-action:none;cursor:grab}
.title .strip:active{cursor:grabbing}
.title h1{margin:0;font-size:104px;line-height:1.05;font-weight:900;letter-spacing:.04em;color:#f5f7f8;
  text-shadow:0 0 26px rgba(111,211,200,.28);opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s}
.title h1.on{opacity:1;transform:none}
.title .a{font-size:30px;color:var(--amber);height:42px;margin-top:6px;opacity:0;transition:opacity 1s}
.title .a.on{opacity:1}
.title .sub{font-size:17px;color:var(--sub);margin-top:2px}
.title .go{height:76px;display:flex;align-items:center;margin-top:14px}
.title .hintline{position:absolute;bottom:28px;font-size:17px;color:var(--sub);opacity:.9}
@keyframes fadein{to{opacity:1}}

/* ---------- 모달 ---------- */
.modal{display:none;background:rgba(5,8,11,.72);z-index:30;align-items:center;justify-content:center}
.modal.show{display:flex}
.mcard{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.55);
  max-width:1160px;max-height:672px;overflow:auto;padding:26px 30px;position:relative;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.mcard h2{margin:0 0 6px;font-size:28px}
.mcard h3{margin:0 0 8px;font-size:21px}
.mcard p{margin:6px 0;font-size:19px;line-height:1.6;color:#dfe6ec}
.mcard .sm{font-size:15px;color:var(--sub)}
.mfoot{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}

/* 장면 */
.scene{width:1000px}
.scene .place{font-size:16px;color:var(--sub);margin-bottom:8px;letter-spacing:.04em}
.scene .stagev{display:flex;justify-content:space-between;align-items:flex-end;height:176px;padding:0 40px;border-bottom:1px solid var(--line)}
.scene .pl{width:150px;height:170px;opacity:.38;transition:opacity .15s,transform .15s;transform:translateY(6px)}
.scene .pl.on{opacity:1;transform:none}
.scene .pl svg{width:150px;height:170px}
.scene .mid{flex:1;text-align:center;font-size:15px;color:var(--sub);padding-bottom:10px}
.scene .box{min-height:132px;padding:16px 8px 6px}
.scene .who{font-size:17px;font-weight:800;color:var(--amber);margin-bottom:6px}
.scene .txt{font-size:25px;line-height:1.55;min-height:78px}
.scene .txt.narr{color:#cfd8e0;font-style:italic}
.scene .txt.sys{color:#bfe9e4;border-left:4px solid var(--teal);padding-left:14px;font-style:normal}

/* ---------- 본 화면 ---------- */
.main{position:absolute;inset:0;display:flex;flex-direction:column}
.top{height:52px;flex:none;display:flex;align-items:center;gap:18px;padding:0 150px 0 18px;background:#141a21;border-bottom:1px solid var(--line)}
.brand{font-size:16px;color:var(--sub);white-space:nowrap}
.brand b{color:var(--ink);font-size:18px}
.tl{display:flex;gap:6px;flex:1;min-width:0}
.chip{font-size:14px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.now{background:var(--amber);border-color:var(--amber);color:#241a05}
.chip.past{opacity:.45}
.chip.halt{border-color:rgba(240,118,106,.7);color:#ffb0a8}
.chip.halt.now{background:var(--red);color:#2a0c08;border-color:var(--red)}
.body{flex:1;display:flex;min-height:0}
.lots{width:300px;flex:none;overflow:auto;background:#151b22;border-right:1px solid var(--line);padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.lots h3{margin:0 0 2px;font-size:18px}
.lots .help{font-size:13px;color:var(--sub);line-height:1.45;margin-bottom:2px}
.lot{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;min-height:46px}
.lot.clear{border-color:rgba(111,211,200,.65)}
.lot.murky{border-color:rgba(160,170,180,.55)}
.lot.fresh{box-shadow:0 0 0 1px rgba(242,184,75,.4)}
.lot .ic{flex:none;width:34px;height:24px}
.lot .nm{flex:1;min-width:0;line-height:1.25}
.lot .nm b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lot .nm small{font-size:12.5px;color:var(--sub)}
.lot .btn{padding:5px 9px;font-size:13px;flex:none}
.lot.need .btn{background:var(--amber);border-color:var(--amber);color:#241a05;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,184,75,.55)}50%{box-shadow:0 0 0 7px rgba(242,184,75,0)}}
.lots .grow{flex:1}
.trips{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--sub)}
.trips b{color:var(--ink);font-size:16px}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--amber);margin-right:4px;vertical-align:-2px}
.dot.off{background:transparent;border:2px solid var(--line)}
.center{flex:1;min-width:0;padding:10px 16px 6px;display:flex;flex-direction:column;gap:7px}
.banner{background:rgba(242,184,75,.1);border:1px solid rgba(242,184,75,.4);border-radius:10px;padding:8px 14px;font-size:16.5px;line-height:1.45;color:#ffe3ad}
.banner.warn{background:rgba(240,118,106,.12);border-color:rgba(240,118,106,.55);color:#ffcfc9}
.rows{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.row{flex:1;display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;min-height:0}
.row.dead{opacity:.5}
.row.hold{border-color:rgba(240,118,106,.6)}
.row .ico{width:52px;height:52px;flex:none;color:#aeb9c3}
.row .nmb{width:214px;flex:none;line-height:1.3}
.row .nmb b{font-size:17.5px;display:block;margin-bottom:2px}
.row .nmb .tags{min-height:22px}
.row .nmb small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.row .mid{flex:1;min-width:0}
.row .ai{font-size:14px;color:var(--sub);margin-bottom:4px;line-height:1.35}
.row .ai b{color:var(--amber)}
.row .ai .lowd{color:var(--red);font-weight:700}
.slots{display:flex;gap:4px;align-items:flex-end}
.slot{width:30px;height:30px;border-radius:7px;border:2px dashed #52606f;background:transparent;position:relative;padding:0}
.slot.on{border:2px solid #dbe3e8;background:linear-gradient(#f6f9fa,#aeb9c1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.slot.dis{opacity:.25;cursor:default}
.slot.aim::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid var(--amber)}
.row .fact{font-size:13px;line-height:1.3;color:var(--sub);margin-top:6px}
.row .fact.ok{color:var(--green)}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper .n{width:34px;text-align:center;font-size:26px;font-weight:900}
.stepper button{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel2);font-size:22px;font-weight:900;padding:0;line-height:1}
.stepper button:disabled{opacity:.3}
.rowact{width:104px;flex:none;text-align:center}
.bot{height:70px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:#141a21;border-top:1px solid var(--line)}
.bot .pool{flex:1;font-size:16px;color:var(--sub);line-height:1.5}
.bot .pool b{color:var(--ink)}
.bot .pool .cl{color:#a8ece4}
.bot .pool .mu{color:#c8d0d7}
.bot .pool .un{color:var(--amber)}
.halt{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0}
.haltbox{background:rgba(240,118,106,.1);border:1.5px solid rgba(240,118,106,.55);border-radius:14px;padding:14px 20px}
.haltbox h2{margin:0 0 4px;font-size:28px;color:#ffc0b9}
.haltbox p{margin:3px 0;font-size:18px;line-height:1.55;color:#f1dad7}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mini .c{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--sub);line-height:1.4}
.mini .c b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:2px}

/* 시편 휘기 */
.bendcard{width:1040px}
.bendwrap{display:flex;gap:18px;align-items:stretch}
.bendleft{flex:1;min-width:0}
.bendsvg{width:100%;height:auto;background:#10161c;border:1.5px solid var(--line);border-radius:14px;touch-action:none;cursor:grab}
.bendsvg:active{cursor:grabbing}
.bendside{width:250px;flex:none;display:flex;flex-direction:column;align-items:center}
.bendside .av{width:130px;height:150px}
.bubble{margin-top:8px;background:#fff;color:#161b20;border-radius:14px;padding:10px 14px;font-size:20px;font-weight:700;min-height:48px;width:100%;text-align:center;opacity:0;transition:opacity .3s;position:relative}
.bubble.on{opacity:1}
.bubble::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:10px solid #fff}
.bendsvg .mt{fill:#8da0b1;font-size:13px}
.rip{fill:none;stroke:#6fd3c8;stroke-width:2.6;transform-box:fill-box;transform-origin:center;animation:rip .85s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:.95}to{transform:scale(3.4);opacity:0}}
.cap{fill:#d4f3ee;font-size:19px;font-weight:700;animation:capup .95s ease-out forwards}
@keyframes capup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-24px)}}
.dst{fill:#7d837d;animation:fall .9s ease-in forwards}
@keyframes fall{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(46px)}}
.spk{fill:#fff6d8;animation:spark .5s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
.verdict{display:flex;gap:14px;justify-content:center;margin-top:14px;min-height:56px}
.bendmsg{font-size:17px;color:var(--sub);text-align:center;margin-top:10px;min-height:26px}

/* 현장 확인 */
.fieldcard{width:1020px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shelf{display:flex;gap:8px;align-items:flex-end;height:96px;padding:10px 14px;background:#10161c;border:1.5px solid var(--line);border-radius:12px;margin:12px 0}
.shelf .blk{width:46px;height:34px;border-radius:7px;background:linear-gradient(#f6f9fa,#aeb9c1);border:2px solid #dbe3e8}
.shelf .emptyt{color:var(--sub);font-size:18px;align-self:center}
.ledger{display:flex;gap:16px;margin-top:10px}
.listing{width:270px;flex:none;background:#10161c;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.55}
.listing .no{font-size:30px;font-weight:900;color:var(--amber);letter-spacing:.04em;margin:4px 0}
.tags2{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tagc{background:var(--paper);color:#2a2112;border-radius:8px 14px 14px 8px;padding:12px 16px 12px 26px;position:relative;border:0;text-align:left;font-size:16px;min-height:104px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.tagc::before{content:"";position:absolute;left:9px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#2a2112;opacity:.7}
.tagc b{display:block;font-size:22px;letter-spacing:.03em}
.tagc .res{display:block;margin-top:6px;font-size:15.5px;font-weight:700}
.tagc.open.used{background:#cfe9c8}
.tagc.open.none{background:#f0c9c3}
.tagc .same{display:inline-block;background:#b3261e;color:#fff;border-radius:6px;padding:1px 7px;font-size:13px;margin-left:6px;vertical-align:2px}
.tagc:not(.open):hover{transform:translateY(-2px)}
.fnote{font-size:16px;color:var(--sub);margin-top:10px;line-height:1.5}

/* 결과 */
.restab{width:100%;border-collapse:collapse;margin-top:8px}
.restab td{padding:8px 8px;border-bottom:1px solid var(--line);font-size:17px;vertical-align:middle}
.restab .nm{width:300px;font-weight:700}
.bar{height:16px;border-radius:8px;background:#10161c;border:1px solid var(--line);overflow:hidden;width:200px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar i.cut{background:var(--amber)}
.bar i.stop{background:var(--red)}
.st{font-weight:800}
.st.ok{color:var(--green)}.st.cut{color:var(--amber)}.st.stop,.st.closing,.st.closed,.st.revoked{color:var(--red)}
.note{font-size:15px;color:#e8c9c5}
.news{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--red);background:rgba(240,118,106,.1);font-size:17px;line-height:1.55}
.grade{display:inline-flex;align-items:center;justify-content:center;width:112px;height:112px;border-radius:50%;border:5px double var(--amber);color:var(--amber);font-size:64px;font-weight:900;transform:rotate(-8deg)}
.scorebox{display:flex;gap:28px;align-items:center}
.scorebox table td{padding:3px 12px 3px 0;font-size:18px}
.rulegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.rg{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.rg svg{margin:0 auto 6px;width:54px;height:54px;color:var(--teal)}
.rg b{display:block;font-size:17px;margin-bottom:4px}
.rg span{font-size:14.5px;line-height:1.5;color:var(--sub);display:block}
.steps3{display:flex;gap:14px;margin-top:12px}
.steps3 .s{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.steps3 .s b{display:block;font-size:20px;margin-bottom:4px;color:var(--amber)}
.steps3 .s span{font-size:16.5px;line-height:1.55;color:#dbe3ea}
.final{width:1060px;text-align:center}
.final .fs{width:470px;margin:6px auto 0}.final .fs svg{width:100%;height:auto;cursor:default;touch-action:auto}
.final .big{font-size:44px;font-weight:900;margin:6px 0;line-height:1.25}
.final .tagl{font-size:28px;color:var(--amber);margin:10px 0}
.facts{text-align:left;font-size:15.5px;line-height:1.6;color:#d8e0e7;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-top:10px}
.facts b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="screen"></div>
  <div id="modal" class="modal"></div>
  <div id="toast"></div>
  <div id="hud"><button class="btn sm" id="muteBtn" type="button">소리 켜짐</button></div>
</div>
<script>

(function(){
'use strict';


/* ===== 규칙 엔진: 화면과 분리된 순수 함수. 게임 속 수치는 모두 가상이다. ===== */
var FACT = [
  { id:'e1', name:'대형 수출업체 1', kind:'big',  precision:false, need:4, cap:7, inv0:8, ai:5, data:5, icon:'big',
    people:'협력사까지 약 3,000명', exporter:true },
  { id:'e2', name:'대형 수출업체 2', kind:'big',  precision:false, need:4, cap:7, inv0:0, ai:5, data:5, icon:'big',
    people:'협력사까지 약 3,000명', exporter:true },
  { id:'co', name:'대구 전자부품 조합', kind:'small', precision:true, need:3, cap:4, inv0:1, ai:2, data:1, icon:'co',
    people:'소공장 9곳 · 직원 약 90명' },
  { id:'jn', name:'북구 보청기 기판 공장', kind:'small', precision:true, need:2, cap:3, inv0:0, ai:1, data:1, icon:'ear', hold:true,
    people:'직원 12명 · 대표 서진아' },
  { id:'bs', name:'부산 센서 공장', kind:'mid', precision:false, need:3, cap:4, inv0:2, ai:4, data:4, icon:'sensor', resale:true,
    people:'직원 약 40명' }
];
var WEEKS = [
  { rel:true,  date:'7월 14일', ban:23, label:'1주차' },
  { rel:true,  date:'7월 21일', ban:30, label:'2주차' },
  { rel:false, date:'7월 28일', ban:37, label:'3주차' },
  { rel:true,  date:'8월 4일',  ban:44, label:'4주차' }
];
var TRIPS = [2, 2, 0, 1];
var HOLD_UNTIL_WEEK = 2;        /* 자동 보류는 3주차(인덱스 2)에 풀린다. 3주차는 방출 중단이라 사실상 4주차까지 막힌다. */
var CLOSE_STREAK = 2;           /* 가동 50% 미만이 연속 2주면 문을 닫는다 */

function factOf(id){ for (var i=0;i<FACT.length;i++) if (FACT[i].id===id) return FACT[i]; return null; }

function initLots(){
  var base = [
    ['L1','2026 입고 · 012','clear'],
    ['L2','2031 입고','clear'],
    ['L3','2038 입고','murky'],
    ['L4','2044 입고','clear'],
    
    ['L6','2049 입고 · 가','murky'],
    ['L7','2049 입고 · 나','clear'],
    ['N1','2050 입고 · 가','clear'],
    ['N2','2050 입고 · 나','murky'],
    ['N3','2050 입고 · 다','clear']
  ];
  return base.map(function(b, i){
    return { id:b[0], tag:b[1], size:4, rem:4, truth:b[2], label:null, labelBy:null, tests:0,
             avail: i < 6, fresh: i >= 6 };
  });
}

function newState(){
  var f = {};
  FACT.forEach(function(x){
    f[x.id] = { inv:x.inv0, closed:false, low:0, hold:!!x.hold, revoked:false, known:false,
                outs:[], recv:[], defects:0, resold:0, evidence:false, cleared:false };
  });
  return {
    w:0, lots:initLots(), f:f, trips:TRIPS[0], interview:false, mislabel:0,
    viol:{ resale:0, illegal:0, wrongRevoke:0 }, history:[], done:false, caught:false
  };
}

function lotById(st, id){ for (var i=0;i<st.lots.length;i++) if (st.lots[i].id===id) return st.lots[i]; return null; }

function pools(st){
  var c=0, m=0, u=0;
  st.lots.forEach(function(l){
    if (!l.avail || l.rem<=0) return;
    if (l.label==='clear') c+=l.rem; else if (l.label==='murky') m+=l.rem; else u+=l.rem;
  });
  return { clear:c, murky:m, unk:u };
}

function maxFor(st, id){
  var x = factOf(id), s = st.f[id];
  if (!WEEKS[st.w].rel) return 0;
  if (s.closed || s.revoked || s.hold) return 0;
  return x.cap;
}

function feasible(st, alloc){
  var p = pools(st), P=0, T=0;
  FACT.forEach(function(x){ var n = alloc[x.id]||0; T+=n; if (x.precision) P+=n; });
  return P <= p.clear && T <= p.clear + p.murky;
}

function totalAlloc(alloc){ var t=0; for (var k in alloc) t += alloc[k]||0; return t; }

/* AI 안: 예측치를 한도 안에서 그대로 따르되, 시편 확인이 끝난 묶음만큼만 */
function aiPlan(st){
  var a = {};
  FACT.forEach(function(x){ a[x.id] = Math.min(maxFor(st, x.id), x.ai); });
  var guard = 200;
  while (!feasible(st, a) && guard-- > 0){
    var best=null;
    FACT.forEach(function(x){ if ((a[x.id]||0) > 0 && (best===null || a[x.id] >= a[best])) best = x.id; });
    if (best===null) break;
    a[best]--;
  }
  return a;
}

/* 한 주를 마감한다. alloc은 {id:묶음수}. 반환: 보고서 */
function resolveWeek(st, alloc){
  var w = st.w, rep = { w:w, rows:[], notes:[], recvTotal:0 };
  var order = function(prec){
    var cl = st.lots.filter(function(l){ return l.avail && l.rem>0 && l.label==='clear'; });
    var mu = st.lots.filter(function(l){ return l.avail && l.rem>0 && l.label==='murky'; });
    return prec ? cl : mu.concat(cl);
  };
  var take = function(n, prec){
    var good=0, bad=0, lots = order(prec);
    for (var i=0;i<lots.length && n>0;i++){
      var l = lots[i], t = Math.min(n, l.rem);
      l.rem -= t; n -= t;
      if (l.truth==='clear') good += t; else bad += t;
    }
    return { good:good, bad:bad };
  };
  FACT.forEach(function(x){
    var s = st.f[x.id], n = alloc[x.id]||0, eff = 0, rec = { n:n, eff:0, bad:0, resold:0 };
    if (n>0 && WEEKS[w].rel && maxFor(st, x.id) >= n){
      var r = take(n, x.precision);
      rep.recvTotal += n;
      if (x.resale && !s.revoked){ rec.resold = n; s.resold += n; eff = 0; }
      else if (x.precision){ eff = r.good; rec.bad = r.bad; s.defects += r.bad; }
      else eff = n;
      rec.eff = eff; s.inv += eff;
    }
    s.recv.push(rec);
  });
  FACT.forEach(function(x){
    var s = st.f[x.id], row = { id:x.id, out:0, state:'', rec:s.recv[s.recv.length-1], inv:0 };
    if (s.closed){ row.state='closed'; s.outs.push(0); rep.rows.push(row); return; }
    if (s.revoked){ row.state='revoked'; s.outs.push(0); rep.rows.push(row); return; }
    var have = s.inv, out = Math.min(1, have / x.need);
    s.inv = Math.max(0, have - x.need);
    s.outs.push(out); row.out = out; row.inv = s.inv;
    if (out < 0.5) s.low++; else s.low = 0;
    if (s.low >= CLOSE_STREAK){ s.closed = true; row.state='closing'; }
    else row.state = out >= 0.95 ? 'ok' : (out >= 0.5 ? 'cut' : 'stop');
    rep.rows.push(row);
  });
  /* 3주차 마감 뒤: 전매가 시장에 드러난다 */
  if (w >= 2){
    var b = st.f.bs;
    if (b.resold > 0 && !b.revoked){ b.revoked = true; st.viol.resale = 1; rep.notes.push('resale'); }
  }
  st.history.push(rep);
  return rep;
}

function advanceWeek(st){
  st.w++;
  if (st.w >= WEEKS.length){ st.done = true; return; }
  st.trips = st.interview && st.w === 3 ? 0 : TRIPS[st.w];
  if (st.w === HOLD_UNTIL_WEEK){ st.f.jn.hold = false; }
  if (st.w === 2){ /* 보충 입고분이 도착한다 */
    st.lots.forEach(function(l){ if (l.fresh) l.avail = true; });
  }
}

/* 현장 확인 판정 */
function applyVerdict(st, id, verdict){
  var s = st.f[id], x = factOf(id), res = { ok:true, kind:'' };
  s.known = true; s.evidence = true;
  if (verdict === 'innocent'){
    if (x.resale){ res.kind = 'missed'; s.cleared = true; }              /* 진짜 전매를 풀어 줌 */
    else { s.hold = false; s.cleared = true; res.kind = 'cleared'; }
  } else if (verdict === 'revoke'){
    if (x.resale){ s.revoked = true; res.kind = 'caught'; st.caught = true; }
    else { s.revoked = true; s.closed = true; st.viol.wrongRevoke = 1; res.kind = 'wrong'; }
  }
  return res;
}

function score(st){
  var parts = {}, closed = 0, sumOut = 0, legit = ['e1','e2','co','jn'];
  legit.forEach(function(id){
    var s = st.f[id], avg = 0;
    s.outs.forEach(function(o){ avg += o; });
    avg = s.outs.length ? avg / WEEKS.length : 0;
    sumOut += avg;
    if (s.closed) closed++;
  });
  parts.factory = Math.max(0, Math.round(sumOut / legit.length * 60 - closed * 6));
  var rule = 25;
  if (st.viol.resale) rule -= 10;
  if (st.viol.illegal) rule -= 8;
  if (st.viol.wrongRevoke) rule -= 15;
  parts.rule = Math.max(0, rule);
  var mis = st.lots.filter(function(l){ return l.label && l.label !== l.truth; }).length;
  st.mislabel = mis;
  parts.lots = Math.max(0, 15 - mis * 5);
  parts.total = parts.factory + parts.rule + parts.lots;
  parts.closed = closed;
  var g = 'C';
  if (parts.total >= 88 && closed === 0) g = 'S';
  else if (parts.total >= 72 && closed === 0) g = 'A';
  else if (parts.total >= 52) g = 'B';
  parts.grade = g;
  return parts;
}

var Snd = {
  ctx:null, on:true, master:null, nb:null,
  init:function(){
    if (this.ctx){ this.resume(); return; }
    try{
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      var c = new C(); this.ctx = c; this.master = c.createGain(); this.master.gain.value = 0.85; this.master.connect(c.destination);
      var len = c.sampleRate, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
      this.nb = b;
    }catch(e){ this.ctx = null; }
  },
  resume:function(){ try{ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }catch(e){} },
  ok:function(){ return !!(this.ctx && this.on && this.nb); },
  grain:function(t, f, q, g, dur){
    try{
      var c = this.ctx, s = c.createBufferSource(); s.buffer = this.nb;
      var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      var ga = c.createGain(); ga.gain.setValueAtTime(0.0001, t);
      ga.gain.exponentialRampToValueAtTime(g, t+0.0015); ga.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      s.connect(bp); bp.connect(ga); ga.connect(this.master); s.start(t, Math.random()*0.8); s.stop(t+dur+0.02);
    }catch(e){}
  },
  crackle:function(){
    if (!this.ok()) return;
    var t = this.ctx.currentTime, n = 3 + Math.floor(Math.random()*5);
    for (var i=0;i<n;i++) this.grain(t + Math.random()*0.15, 2200 + Math.random()*5400, 2 + Math.random()*6, 0.4 + Math.random()*0.5, 0.012 + Math.random()*0.03);
  },
  tone:function(freq, dur, type, g, delay){
    if (!this.ok()) return;
    try{
      var c = this.ctx, t = c.currentTime + (delay||0), o = c.createOscillator(), ga = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      ga.gain.setValueAtTime(0.0001, t); ga.gain.exponentialRampToValueAtTime(g || 0.1, t+0.01); ga.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(ga); ga.connect(this.master); o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  },
  thud:function(){
    if (!this.ok()) return;
    try{
      var c = this.ctx, t = c.currentTime, o = c.createOscillator(), ga = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(55, t+0.14);
      ga.gain.setValueAtTime(0.0001, t); ga.gain.exponentialRampToValueAtTime(0.5, t+0.01); ga.gain.exponentialRampToValueAtTime(0.0001, t+0.18);
      o.connect(ga); ga.connect(this.master); o.start(t); o.stop(t+0.22);
    }catch(e){}
  },
  click:function(){ this.tone(640, 0.05, 'triangle', 0.07); },
  stamp:function(){ this.thud(); },
  chime:function(){ this.tone(523, 0.18, 'sine', 0.1, 0); this.tone(659, 0.18, 'sine', 0.1, 0.12); this.tone(784, 0.3, 'sine', 0.1, 0.24); },
  warn:function(){ this.tone(196, 0.22, 'square', 0.05, 0); this.tone(165, 0.3, 'square', 0.05, 0.16); }
};
function setMuteLabel(){ $('#muteBtn').textContent = Snd.on ? '소리 켜짐' : '소리 꺼짐'; }

var uidN = 0;
function makeBender(svg, o){
  o = o || {};
  var uid = ++uidN, clear = o.clear !== false, dy = 0, acc = 0, thr = 9, travel = 0, crack = 0, dull = 0;
  var ready = false, drag = false, user = false, dead = false, spike = 0, tagOn = false;
  var wv = []; for (var k=0;k<48;k++) wv.push(0);
  var timers = [], intervals = [];
  var X0 = 124, Y0 = 130, LEN = 470;
  svg.setAttribute('viewBox', '0 0 700 260');
  svg.innerHTML =
    '<rect x="0" y="0" width="700" height="260" fill="none"/>'
    + '<g><rect x="58" y="82" width="68" height="96" rx="9" fill="#3a424b"/><rect x="58" y="82" width="68" height="13" rx="6" fill="#58626c"/>'
    + '<circle cx="92" cy="106" r="5" fill="#1f262d"/><circle cx="92" cy="154" r="5" fill="#1f262d"/></g>'
    + '<g class="dust"></g><g class="rips"></g>'
    + '<path class="sSh" fill="none" stroke="#6f7881" stroke-width="5" stroke-linecap="round"/>'
    + '<path class="sBa" fill="none" stroke="#b6c0c7" stroke-width="18" stroke-linecap="round"/>'
    + '<path class="sHi" fill="none" stroke="#f1f6f8" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>'
    + '<g class="tagG"></g>'
    + '<circle class="grip" r="17" fill="rgba(242,184,75,.12)" stroke="#f2b84b" stroke-width="3" stroke-dasharray="5 4"/>'
    + '<g class="caps"></g>'
    + '<text x="150" y="217" class="mt">울음 미터 (소리가 안 들려도 보입니다)</text>'
    + '<g transform="translate(150,222)"><rect width="400" height="32" rx="7" fill="rgba(255,255,255,.04)" stroke="#34404d"/>'
    + '<path class="wave" fill="none" stroke="#6fd3c8" stroke-width="2.2"/></g>';
  var q = function(s){ return svg.querySelector(s); };
  var sSh = q('.sSh'), sBa = q('.sBa'), sHi = q('.sHi'), grip = q('.grip'), rips = q('.rips'), dustG = q('.dust'), caps = q('.caps'), wave = q('.wave'), tagG = q('.tagG');

  function geo(){
    var ex = X0 + LEN - Math.abs(dy)*0.32, ey = Y0 + dy;
    return { ex:ex, ey:ey, c1x:X0+LEN*0.42, c1y:Y0, c2x:X0+LEN*0.72, c2y:Y0+dy*0.5 };
  }
  function bez(t){
    var g = geo(), u = 1 - t;
    return { x:u*u*u*X0 + 3*u*u*t*g.c1x + 3*u*t*t*g.c2x + t*t*t*g.ex, y:u*u*u*Y0 + 3*u*u*t*g.c1y + 3*u*t*t*g.c2y + t*t*t*g.ey };
  }
  function update(){
    var g = geo(), d = 'M' + X0 + ' ' + Y0 + ' C' + g.c1x + ' ' + g.c1y + ' ' + g.c2x + ' ' + g.c2y + ' ' + g.ex + ' ' + g.ey;
    sBa.setAttribute('d', d); sHi.setAttribute('d', d); sSh.setAttribute('d', d);
    sHi.setAttribute('transform', 'translate(0,-4)'); sSh.setAttribute('transform', 'translate(0,5)');
    grip.setAttribute('cx', g.ex); grip.setAttribute('cy', g.ey);
    if (tagOn) placeTag();
  }
  function mk(name, attrs){ var e = document.createElementNS(SVGNS, name); for (var a in attrs) e.setAttribute(a, attrs[a]); return e; }
  function later(el, ms){ timers.push(setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, ms)); }
  var CAPS = ['바삭', '바사삭', '사각', '바삭바삭', '바삭…'];
  function visual(){
    var p = bez(0.3 + Math.random()*0.6);
    var r = mk('circle', { cx:p.x, cy:p.y, r:22, 'class':'rip' }); rips.appendChild(r); later(r, 900);
    for (var i=0;i<4;i++){
      var s = mk('circle', { cx:p.x, cy:p.y, r:2.2, 'class':'spk' });
      s.style.setProperty('--dx', (Math.random()*60-30) + 'px'); s.style.setProperty('--dy', (Math.random()*-46-6) + 'px');
      caps.appendChild(s); later(s, 600);
    }
    var t = mk('text', { x:p.x - 20 + Math.random()*20, y:p.y - 26, 'class':'cap' }); t.textContent = CAPS[Math.floor(Math.random()*CAPS.length)];
    caps.appendChild(t); later(t, 1000);
    spike = Math.max(spike, 9 + Math.random()*5);
  }
  function dustFx(){
    var p = bez(0.35 + Math.random()*0.5);
    for (var i=0;i<3;i++){
      var c = mk('circle', { cx:p.x + Math.random()*24-12, cy:p.y + 8, r:2 + Math.random()*2, 'class':'dst' });
      dustG.appendChild(c); later(c, 950);
    }
  }
  function fire(silent){
    if (clear){
      if (!silent) crack++;
      Snd.crackle(); visual();
      if (!silent && o.onCrackle) o.onCrackle(crack);
    } else {
      if (!silent) dull++;
      if (dull % 5 === 1 || silent) Snd.thud();
      dustFx();
    }
  }
  function checkReady(){
    if (ready) return;
    if ((clear && crack >= 5) || (!clear && travel >= 460)){ ready = true; if (o.onReady) o.onReady(); }
  }
  function step(d, silent){
    if (Math.abs(dy) < 16) return;
    acc += d; if (!silent) travel += d;
    if (acc >= thr){ acc = 0; thr = 8 + Math.random()*9; fire(silent); if (!silent) checkReady(); }
  }
  function moveTo(ny, silent){
    if (!isFinite(ny)) return;
    ny = clamp(ny, -105, 105);
    var d = Math.abs(ny - dy); dy = ny; update(); step(d, silent);
  }
  function ptr(e){
    var r = svg.getBoundingClientRect(); if (!r.height) return Y0;
    return (e.clientY - r.top) * (260 / r.height);
  }
  svg.addEventListener('pointerdown', function(e){
    if (dead) return; user = true; drag = true;
    try{ svg.setPointerCapture(e.pointerId); }catch(er){}
    moveTo(ptr(e) - Y0);
  });
  svg.addEventListener('pointermove', function(e){ if (drag && !dead) moveTo(ptr(e) - Y0); });
  var up = function(){ drag = false; };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up); svg.addEventListener('lostpointercapture', up);

  intervals.push(setInterval(function(){
    var v;
    if (spike > 0.8){ v = (Math.random() < 0.5 ? -1 : 1) * spike; spike *= 0.55; } else { spike = 0; v = (Math.random() - 0.5) * (clear ? 1.4 : 0.8); }
    wv.push(v); wv.shift();
    var d = '';
    for (var i=0;i<wv.length;i++) d += (i ? 'L' : 'M') + (4 + i * (392/47)).toFixed(1) + ' ' + (16 + clamp(wv[i], -13, 13)).toFixed(1);
    wave.setAttribute('d', d);
  }, 60));

  function idleLoop(){
    if (dead || user) return;
    var s = 0, N = 26;
    (function tick(){
      if (dead || user) return;
      s++; moveTo(-Math.sin(Math.PI * s / N) * 74, true);
      if (s < N) timers.push(setTimeout(tick, 28));
      else { dy = 0; update(); timers.push(setTimeout(idleLoop, 1500)); }
    })();
  }
  function placeTag(){
    var p = bez(0.56);
    tagG.innerHTML = '<g transform="translate(' + p.x.toFixed(1) + ',' + (p.y - 62).toFixed(1) + ')">'
      + '<line x1="0" y1="44" x2="0" y2="60" stroke="#8a8f94" stroke-width="2.5"/>'
      + '<g transform="rotate(-3 0 22)"><path d="M-74 0 H70 q8 0 8 8 V36 q0 8 -8 8 H-74 Z" fill="#ead9b5" stroke="#b79d6b"/><circle cx="-63" cy="22" r="4" fill="#6e5a30"/>'
      + '<text x="-51" y="28" font-size="15.5" font-weight="800" fill="#2a2112">2050 입고 · 001</text></g></g>';
  }
  update();
  if (o.idle) timers.push(setTimeout(idleLoop, 700));
  return {
    destroy:function(){ dead = true; timers.forEach(clearTimeout); intervals.forEach(clearInterval); },
    stats:function(){ return { crack:crack, travel:travel, ready:ready }; },
    showTag:function(){ tagOn = true; placeTag(); }
  };
}

async function doField(id){
  if (modalOpen || busy) return;
  var x = factOf(id), s = ST.f[id];
  if (ST.trips <= 0){ toast('이번 주 출장은 모두 사용했습니다.'); return; }
  if (s.known || s.closed || s.revoked) return;
  ST.trips--; ST.checks = (ST.checks || 0) + 1;
  var v = await fieldModal(x);
  if (v === 'innocent' || v === 'revoke'){
    var r = applyVerdict(ST, id, v);
    A[id] = Math.min(A[id] || 0, maxFor(ST, id));
    if (r.kind === 'cleared') await notice('보류를 풀었습니다', '<p>서진아 공장의 자동 보류를 해제했습니다. 같은 번호의 꼬리표가 있었지만 이미 녹여 쓴 묶음이었고, 시장 매물은 지난 번호를 베낀 것이었습니다. 이번 주부터 배정할 수 있습니다.</p>');
    else if (r.kind === 'caught') await notice('전매를 확인했습니다', '<p>매물 번호와 같은 꼬리표의 묶음은 쓴 기록이 없었습니다. 차익 환수, 위약금, 등록 말소 절차를 시작합니다. 이 업체는 배정 목록에서 빠집니다.</p>');
    else if (r.kind === 'wrong') await notice('등록 말소가 시작되었습니다', '<p>작업일지에는 네 묶음 모두 녹여 쓴 기록이 있었습니다. 근거 없이 등록을 말소해 이 공장은 문을 닫게 됩니다.</p>');
    else await notice('기록했습니다', '<p>‘문제 없음’으로 기록하고 현장을 떠납니다.</p>');
  }
  render();
}

  return '<div class="lot ' + (l.label || 'need') + (l.fresh ? ' fresh' : '') + '">' + lotIcon()
    + '<div class="nm"><b>' + l.tag + '</b><small>' + sub + '</small></div>'
    + '<button class="btn sm" type="button" data-act="bend" data-id="' + l.id + '">' + (l.label ? '다시 휘기' : '시편 휘기') + '</button></div>';

function rowHTML(x){
  var s = ST.f[x.id], dead = s.closed || s.revoked, mx = maxFor(ST, x.id), a = A[x.id] || 0;
  var tags = '';
  if (x.exporter) tags += '<span class="tg amber">수출 한도 특례</span>';
  if (x.precision) tags += '<span class="tg teal">정밀 납땜</span>';
  if (s.hold) tags += '<span class="tg red">자동 보류</span>';
  if (s.revoked) tags += '<span class="tg red">등록 말소</span>';
  else if (s.closed) tags += '<span class="tg gray">문 닫음</span>';
  else if (x.id === 'jn' && s.cleared) tags += '<span class="tg green">보류 해제</span>';
  var slots = '';
  for (var i=0;i<x.cap;i++){
    var dis = (i >= mx) ? ' dis' : '';
    slots += '<button type="button" class="slot' + (i < a ? ' on' : '') + (i === x.ai - 1 ? ' aim' : '') + dis + '" data-act="slot" data-id="' + x.id + '" data-n="' + (i+1) + '"' + (i >= mx ? ' disabled' : '') + '></button>';

  var fact;

  else if (s.hold) fact = '자동 보류 중(처리 2주) · 현장 확인으로 판단할 수 있음';
  else if (s.known) fact = '현장 확인 · 재고 ' + s.inv + '묶음 · 필요 ' + x.need + '묶음/주';

  var aiLine = 'AI 예측 <b>' + x.ai + '</b> · 한도 ' + x.cap + ' · 데이터 ' + dotsHTML(x.data);

  return '<div class="row' + (dead ? ' dead' : '') + (s.hold ? ' hold' : '') + '"><div class="ico">' + ICON[x.icon] + '</div>'
    + '<div class="nmb"><b>' + x.name + '</b><div class="tags">' + tags + '</div><small>' + x.people + '</small></div>'
    + '<div class="mid"><div class="ai">' + aiLine + '</div><div class="slots">' + slots + '</div><div class="fact' + (s.known ? ' ok' : '') + '">' + fact + '</div></div>'
    + step + '<div class="rowact">' + act + '</div></div>';

      + '<p><b>할 일:</b> 새로 입고된 묶음 3개의 시편을 휘어 순도를 확인하세요. 확인이 끝나면 3주차를 마감합니다.' + (un ? ' (남은 확인 ' + un + '개)' : ' (확인 끝)') + '</p></div>'
      + '<div class="mini">' + FACT.map(function(x){

function whyNot(id){
  var x = factOf(id), p = pools(ST), t = {}; for (var k in A) t[k] = A[k];
  var P = 0; FACT.forEach(function(f){ if (f.precision) P += (t[f.id] || 0); });
  if (x.precision && P + 1 > p.clear) return p.unk > 0 ? '정밀 납땜 공장에는 맑은 묶음만 줄 수 있습니다. 시편을 휘어 맑은 묶음을 더 확인하세요.' : '정밀 납땜 공장에 줄 맑은 묶음이 모자랍니다.';
  return p.unk > 0 ? '시편을 확인한 묶음만 출고할 수 있습니다. 왼쪽 묶음을 휘어 보세요.' : '창고에 출고할 묶음이 모자랍니다.';
}
function trySet(id, n){
  var mx = maxFor(ST, id); n = clamp(n, 0, mx);
  var old = A[id] || 0;
  if (n === old) return;
  var t = {}; for (var k in A) t[k] = A[k]; t[id] = n;
  if (n > old && !feasible(ST, t)){ Snd.warn(); toast(whyNot(id)); return; }
  A[id] = n; render();
}

async function doBend(id){
  if (modalOpen || busy) return;
  var l = lotById(ST, id);
  var r = await bendModal(l, { week:ST.w });
  if (!r) return;
  l.label = r; l.labelBy = 'player'; l.tests++;
  render();
  if (ST.w === 2 && !ST.revealDone && !ST.interview){
    var fresh = ST.lots.filter(function(q){ return q.fresh; });
    if (fresh.every(function(q){ return q.label; })){ ST.revealDone = true; await revealScene(); render(); }
  }
}

function jumpState(target){
  ST = newState(); A = {};
  if (target === 0) return;
  ST.lots.forEach(function(l){ if (l.avail){ l.label = l.truth; l.labelBy = 'player'; } });
  applyVerdict(ST, 'jn', 'innocent'); applyVerdict(ST, 'bs', 'revoke'); ST.checks = 2; ST.trips = 2;
  for (var w=0; w<target; w++){
    ST.w = w;
    var al = WEEKS[w].rel ? aiPlan(ST) : {};
    if (WEEKS[w].rel){ FACT.forEach(function(x){ if (x.id==='jn') al.jn = Math.min(maxFor(ST,'jn'), 3); }); var g = 60; while (!feasible(ST, al) && g-- > 0){ al.e1 = Math.max(0, (al.e1||0) - 1); } }
    resolveWeek(ST, al); advanceWeek(ST);
    ST.lots.forEach(function(l){ if (l.avail && !l.fresh && !l.label){ l.label = l.truth; l.labelBy = 'player'; } });
  }
  ST.w = target; if (target === 3) ST.lots.forEach(function(l){ if (l.fresh && !l.label){ l.label = l.truth; l.labelBy='player'; } });
}

async function main(){
  setMuteLabel();
  var q = (window.location.search || '').match(/jump=(w[1-4]|end)/), jump = q ? q[1] : null;
  if (!jump){
    ST = newState();
    await titleScreen();
    await briefing();
    for (var w=0; w<4; w++){ ST.w = w; await playWeek(w); }
    await ending();
    return;
  }
  if (jump === 'end'){ jumpState(3); await playWeek(3); await ending(); return; }
  var wi = +jump.slice(1) - 1;
  jumpState(wi);
  for (var k=wi; k<4; k++){ ST.w = k; await playWeek(k); }
  await ending();
}
window.__game = { state:function(){ return ST; }, alloc:function(){ return A; } };
main();

})();
</script>
