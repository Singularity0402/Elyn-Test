<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미리도착한하루</title>
<style>
:root{--ink:#2B3340;--paper:#FBF4E4;--cream:#FFF6E0;--gold:#F2B632;--gold2:#D99A1E;--teal:#2E8F8A;--coral:#E8604C;--night:#14202B;--line:#D9CDB0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:clamp(17px,1.05vw,23px);line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:1880px;min-height:100vh;margin:0 auto;padding:10px 12px 22px;display:flex;flex-direction:column;justify-content:center}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#F3EBD6;padding:4px 2px 10px}
.brand{font-weight:800;font-size:19px;letter-spacing:.04em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#steps{display:flex;gap:6px;margin-right:6px}
#steps i{width:12px;height:12px;border-radius:50%;background:#3A4A5A;display:block}
#steps i.cur{background:var(--gold);box-shadow:0 0 0 3px rgba(242,182,50,.35)}
#steps i.ok{background:var(--teal)}
button{font:inherit;cursor:pointer}
.tbtn{background:#22313F;color:#F3EBD6;border:1px solid #3A4A5A;border-radius:999px;padding:6px 14px;min-height:40px}
.tbtn:hover{background:#2C3F51}
main{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
#stage{position:relative;background:#0E1720;border-radius:16px;overflow:hidden;border:1px solid #223344}
#svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#svg:active{cursor:grabbing}
.obj{outline:none}
#q{position:absolute;left:0;right:0;top:4%;text-align:center;color:var(--cream);font-weight:800;font-size:clamp(16px,3.4vw,40px);line-height:1.25;text-shadow:0 2px 14px rgba(0,0,0,.65);pointer-events:none;padding:0 14px;opacity:0;transition:opacity .6s}
#q.on{opacity:1}
#q.end{font-size:clamp(15px,2.7vw,30px)}
#q small{display:block;font-size:.5em;font-weight:700;margin-top:.35em;color:#FFE7A3;text-shadow:0 1px 8px rgba(0,0,0,.85)}
#cap{position:absolute;left:0;right:0;bottom:3.5%;text-align:center;pointer-events:none;padding:0 12px}
#cap span{display:inline-block;background:rgba(14,23,32,.82);color:#FFF6E0;border-radius:10px;padding:7px 16px;font-weight:700;font-size:clamp(15px,2.2vw,26px);opacity:0;transition:opacity .35s}
#cap.on span{opacity:1}
#cap.top{top:3.5%;bottom:auto}
#panel{background:var(--paper);border-radius:16px;padding:18px 18px 20px;min-height:280px}
.kicker{color:var(--teal);font-weight:800;font-size:15px;letter-spacing:.03em;margin:0 0 4px}
h1,h2{margin:0 0 8px;line-height:1.3}
h1{font-size:1.65em}
h2{font-size:1.3em}
p{margin:0 0 10px}
.sit{font-size:1.06em}
.meter{display:flex;gap:8px;align-items:center;font-weight:700;margin:12px 0 4px}
.meter b{display:inline-block;width:26px;height:26px;border-radius:50%;background:#D8D2C2;border:2px solid #BFB8A4}
.meter b.on{background:var(--gold);border-color:var(--gold2)}
.stamps{display:grid;gap:10px;margin:12px 0 4px}
.stamp{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 14px;min-height:58px;color:var(--ink);font-weight:700}
.stamp:hover:not(:disabled){background:#FFF3CF}
.stamp .sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.stamp.right{background:#DDF1E4;border-color:#2F8A55}
.stamp.right .sn{background:#2F8A55}
.stamp.wrong{background:#F1E6E2;border-color:#C9A89F;color:#8A6F68;animation:shake .35s}
.stamp:disabled{cursor:default}
.hintline{background:#FFF0D0;border-radius:10px;padding:8px 12px;margin:8px 0 0;font-size:.94em}
.fact{background:#fff;border-left:6px solid var(--teal);border-radius:8px;padding:10px 14px;margin:12px 0 10px;font-size:.94em}
.fact .tag{display:inline-block;background:var(--teal);color:#fff;font-weight:800;font-size:13px;border-radius:6px;padding:1px 8px;margin-bottom:4px}
.fact .src{display:block;color:#6B6657;font-size:13px;margin-top:6px}
.fiction{display:inline-block;background:var(--gold);color:#3A2C05;font-weight:800;font-size:13px;border-radius:6px;padding:1px 8px;margin-bottom:6px}
.primary{background:var(--gold);color:#2B2008;border:0;border-radius:12px;padding:12px 22px;font-weight:800;min-height:48px;font-size:18px}
.primary:hover{background:#FFC94A}
.second{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px 18px;font-weight:700;min-height:48px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.small{font-size:14px;color:#6B6657}
.list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.list li{background:#fff;border-radius:10px;padding:8px 12px;font-size:.94em;display:flex;gap:10px;align-items:baseline}
.list li b{flex:none;color:var(--teal)}
.score{font-weight:800;font-size:18px;margin:10px 0 0}
.ring{fill:none;stroke:#F2B632;stroke-width:5;stroke-dasharray:14 10;animation:dash 1.1s linear infinite}
.spark{fill:#FFE08A;transform-box:fill-box;transform-origin:center;animation:pop .8s ease-out forwards}
.whdoor{transition:transform 1s ease-in-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes pop{0%{transform:scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button:focus-visible{outline:4px solid #1F6FEB;outline-offset:2px}
@media (max-width:860px){#cap{position:static;padding:0 10px 10px;background:#0E1720}#cap:not(.on){display:none}#cap span{display:block}}
@media (prefers-reduced-motion:reduce){.ring,.spark,.stamp.wrong{animation:none}.whdoor{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">미리도착한하루</div>
    <div class="tools">
      <div id="steps" aria-hidden="true"></div>
      <button class="tbtn" id="snd" type="button">소리 켜짐</button>
      <button class="tbtn" id="restart" type="button">처음부터</button>
    </div>
  </header>
  <main>
    <div id="stage">
      <svg id="svg" viewBox="0 0 800 460" role="group" aria-label="게임 장면"></svg>
      <div id="q"></div>
      <div id="cap"><span></span></div>
    </div>
    <aside id="panel" aria-live="off"></aside>
  </main>
  <div id="live" class="sr" aria-live="polite"></div>
  <noscript>이 게임은 자바스크립트가 켜진 브라우저(크롬, 엣지 등)에서 실행됩니다.</noscript>
</div>

}

});
function endPress(e){
  if(!pressed) return; pressed=false;
  if(moved<8 && downP){ var i=objAt(downP); if(i>=0) addProg(i,0.5); }
  if(e && e.pointerType!=='mouse') hideGlow();
}
svg.addEventListener('pointerup',endPress);
svg.addEventListener('pointercancel',endPress);
svg.addEventListener('pointerleave',function(){ hideGlow(); });
function moveGlow(p,show){ if(!glowEl) return; glowEl.setAttribute('cx',p.x); glowEl.setAttribute('cy',p.y); glowEl.setAttribute('opacity',show?'1':'0'); }
function hideGlow(){ if(glowEl) glowEl.setAttribute('opacity','0'); }

document.addEventListener('keydown',function(e){
  if(stage==='choose'){
    var n=parseInt(e.key,10);
    if(n>=1 && n<=3){ var b=document.querySelectorAll('.stamp')[n-1]; if(b && !b.disabled){ b.click(); } }
  }
});

/* ---------- 헤더 ---------- */
function renderSteps(){
  var h=''; for(var i=0;i<SCENES.length;i++){ h+='<i class="'+(i<sceneIdx?'ok':(i===sceneIdx?'cur':''))+'"></i>'; }
  stepsEl.innerHTML=h;
}
$('#snd').addEventListener('click',function(){
  soundOn=!soundOn; this.textContent=soundOn?'소리 켜짐':'소리 꺼짐'; unlockAudio(); if(soundOn) chime(1);
});
$('#restart').addEventListener('click',function(){ startIntro(); });

/* ---------- 오프닝 ---------- */
function startIntro(){
  stage='intro'; sceneIdx=-1; cur=null; firstTry=0; collected=[]; userTouched=false; bgIsTown=true;
  mk(TOWN_OBJS,TOWN_BG); renderSteps();
  introT0=performance.now(); lastAct=introT0;
  bigQ('이 동네는 왜 회색일까요?'); caption('가로등이나 나무를 문질러 보세요');
  panel.innerHTML=
   '<p class="kicker">2분 · 마우스, 터치, 키보드(Tab, Enter)</p>'+
   '<h1>미리도착한하루</h1>'+
   '<p class="sit">회색으로 멈춘 하루의 물건을 문질러 색을 되돌리고, 필요한 물건이 어떤 길로 도착했는지 골라 보세요. 틀려도 점수가 깎이지 않아요.</p>'+
   '<div class="row"><button class="primary" id="go" type="button">시작하기</button></div>'+
   '<p class="small" style="margin-top:12px">게임 속 상황, 장소, 물건은 모두 가상입니다. 제도 설명은 조달청 공개 자료를 바탕으로 썼습니다.</p>';
  $('#go').addEventListener('click',function(){ unlockAudio(); startGame(); });
  say('이 동네는 왜 회색일까요? 가로등이나 나무를 문질러 보세요. 시작하기 버튼으로 바로 시작할 수도 있습니다.');
}
function introAuto(ts){
  if(stage!=='intro' || userTouched) return;
  var t=((ts-introT0)/1000)%8.5;
  function sm(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
  var a, b;
  if(reduce){ a=1; b=1; }
  else{
    var fade=1-sm((t-7.0)/1.2);
    a=sm((t-0.35)/1.9)*fade; b=sm((t-2.5)/1.9)*fade;
  }
  P[0]=a; P[1]=b; applyOne(0); applyOne(1);
  if(!reduce){
    if(t>0.35 && t<2.3){ var u=(t-0.35)/1.95; moveGlow({x:437+Math.sin(u*14)*30,y:170+u*170},true); }
    else if(t>=2.5 && t<4.5){ var v=(t-2.5)/2; moveGlow({x:560+v*130,y:240+Math.sin(v*14)*30},true); }
    else hideGlow();
  }
}

/* ---------- 게임 진행 ---------- */
function startGame(){ bigQ(''); caption(''); loadScene(0); }
function loadScene(n){
  sceneIdx=n; cur=SCENES[n]; bgIsTown=false; keepRing=false; wrongInScene=0; rubDist=0; resistRub=0; lastRubAt=0;
  mk(cur.objs,cur.bg); renderSteps();
  stage='rub'; sceneStart=performance.now(); lastAct=sceneStart; hideGlow();
  caption(cur.resist?'문질러도 색이 오래 가지 않아요…':'회색 물건을 문질러 색을 되돌려 보세요');
  var free=cur.objs.filter(function(o){return !o.free;}).length;
  panel.innerHTML=
   '<p class="kicker">'+(n+1)+' / '+SCENES.length+' · '+cur.kicker+'</p>'+
   '<span class="fiction">가상 상황</span>'+
   '<p class="sit">'+cur.situation+'</p>'+
   (cur.resist?'<div id="hint2" class="hintline" style="display:none"></div>':'<div class="meter" id="meter"></div>');
  if(!cur.resist) updateMeter();
  say(cur.kicker+'. '+cur.situation+' 회색 물건 '+free+'개를 문질러 보세요.');
}
function showChoose(){
  stage='choose'; caption('도착 방법을 골라 주세요 (키보드 1, 2, 3)');
  var h='<p class="kicker">'+(sceneIdx+1)+' / '+SCENES.length+' · '+cur.kicker+'</p><span class="fiction">가상 상황</span><p class="sit">'+cur.situation+'</p><div class="stamps" id="stamps">';
  cur.options.forEach(function(k,i){ h+='<button class="stamp" type="button" data-k="'+k+'"><span class="sn">'+(i+1)+'</span><span>'+ROUTES[k].name+'</span></button>'; });
  h+='</div><div id="after"></div>';
  panel.innerHTML=h; say('도착 방법을 고르세요. 선택지는 세 가지입니다.');
  var bs=panel.querySelectorAll('.stamp');
  for(var i=0;i<bs.length;i++){ bs[i].addEventListener('click',onStamp); }
  if(bs[0]) bs[0].focus();
}
function onStamp(e){
  var b=e.currentTarget, k=b.getAttribute('data-k'), after=$('#after');
  unlockAudio();
  if(k===cur.answer){
    thud(); setTimeout(function(){chime(3);},160);
    b.className='stamp right'; b.querySelector('.sn').textContent='✔';
    var all=panel.querySelectorAll('.stamp'); for(var i=0;i<all.length;i++){ all[i].disabled=true; }
    if(wrongInScene===0) firstTry++;
    collected.push(cur.route); stage='explain'; caption('');
    after.innerHTML='<div class="fact"><span class="tag">실제 제도 · '+ROUTES[k].name+'</span><br>'+cur.fact+'<span class="src">'+SRC+'</span></div>'+
      '<div class="row"><button class="primary" id="next" type="button">'+(sceneIdx<SCENES.length-1?'다음 장면 ▶':'결과 보기 ▶')+'</button></div>';
    say('맞아요. '+ROUTES[k].name+'. '+cur.fact);
    $('#next').addEventListener('click',function(){ nextScene(); }); $('#next').focus();
  }else{
    wrongInScene++; buzz(); b.className='stamp wrong'; b.disabled=true;
    after.innerHTML='<div class="hintline">'+cur.hints[k]+'</div>'; say(cur.hints[k]);
  }
}
function nextScene(){ if(sceneIdx<SCENES.length-1) loadScene(sceneIdx+1); else openWarehouseDone(); }

/* 5장면: 창고 반전 */
function openWarehouse(){
  stage='flood'; keepRing=false; caption('미리 쌓아 둔 것이 있었어요'); clearRings();
  var d=document.getElementById('whDoor'); if(d){ d.style.transform='translateY(-'+WH_LIFT+'px)'; }
  tone(98,0.6,0,0.16,'triangle');
  var t0=performance.now(), from=P.slice();
  function step(ts){
    var u=Math.min(1,(ts-t0-900)/1400); if(u<0){ requestAnimationFrame(step); return; }
    for(var i=0;i<objs.length;i++){ P[i]=from[i]+(1-from[i])*u; applyOne(i); }
    applyBg();
    if(u<1) requestAnimationFrame(step); else floodDone();
  }
  requestAnimationFrame(step);
}
function floodDone(){
  for(var i=0;i<objs.length;i++){ DONE[i]=true; P[i]=1; applyOne(i); } applyBg();
  fanfare(); collected.push('stock'); stage='explain';
  panel.innerHTML=
   '<p class="kicker">5 / 5 · '+cur.kicker+'</p><h2>미리 도착해 있었습니다</h2>'+
   '<p class="sit">시장에서는 구할 수 없던 구리가, 창고에는 이미 있었어요.</p>'+
   '<div class="fact"><span class="tag">실제 제도 · '+ROUTES.stock.name+'</span><br>'+cur.fact+'<span class="src">'+SRC+'</span></div>'+
   '<div class="row"><button class="primary" id="next" type="button">결과 보기 ▶</button></div>';
  $('#next').addEventListener('click',function(){ nextScene(); }); $('#next').focus();
  say('미리 도착해 있었습니다. '+cur.fact);
}

/* ---------- 엔딩 ---------- */
function openWarehouseDone(){
  stage='end'; sceneIdx=SCENES.length; cur=null; bgIsTown=false;
  mk(TOWN_OBJS,TOWN_BG); renderSteps();
  for(var i=0;i<objs.length;i++){ DONE[i]=true; P[i]=1; applyOne(i); } applyBg();
  bigQ('오늘 하루도, 미리 도착해 있었습니다.<small>처음의 가로등과 나무에도 색이 돌아왔어요.</small>','end'); caption('');
  var h='<p class="kicker">오늘의 도착표</p><h2>다섯 가지 도착 방법</h2><ul class="list">';
  ['mall','bid','innov','urgent','stock'].forEach(function(k,i){ h+='<li><b>'+(i+1)+'</b><span><strong>'+ROUTES[k].name+'</strong> · '+ROUTES[k].line+'</span></li>'; });
  h+='</ul><p class="score">처음 고른 답이 맞은 장면: '+firstTry+' / 4</p>'+
     '<div class="row"><button class="primary" id="save" type="button">도착표 카드 저장</button><button class="second" id="again" type="button">처음부터 다시</button></div>'+
     '<p class="small" style="margin-top:12px">게임 속 상황은 이해를 돕기 위해 단순화한 가상 사례입니다. 실제로 어떤 방식으로 구매하는지는 물품의 종류, 금액, 상황에 따라 다릅니다.</p>';
  panel.innerHTML=h;
  $('#save').addEventListener('click',saveCard); $('#again').addEventListener('click',startIntro);
  fanfare(); say('끝났어요. 오늘 하루도, 미리 도착해 있었습니다. 처음 고른 답이 맞은 장면은 4장면 중 '+firstTry+'장면입니다.');
}
function saveCard(){
  try{
    var c=document.createElement('canvas'); c.width=1080; c.height=1350; var x=c.getContext('2d');
    var F='"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    x.fillStyle='#FBF4E4'; x.fillRect(0,0,1080,1350);
    x.fillStyle='#14202B'; x.fillRect(0,0,1080,250);
    x.fillStyle='#FFF6E0'; x.font='800 76px '+F; x.textAlign='center'; x.fillText('미리도착한하루',540,120);
    x.fillStyle='#F4D98B'; x.font='600 38px '+F; x.fillText('오늘 하루도, 미리 도착해 있었습니다.',540,200);
    var keys=['mall','bid','innov','urgent','stock'], y=300;
    keys.forEach(function(k,i){
      x.fillStyle='#fff'; rr(x,70,y,940,168,24); x.fill();
      x.fillStyle='#2E8F8A'; x.beginPath(); x.arc(150,y+84,44,0,Math.PI*2); x.fill();
      x.fillStyle='#fff'; x.font='800 48px '+F; x.textAlign='center'; x.fillText(String(i+1),150,y+101);
      x.fillStyle='#2B3340'; x.textAlign='left'; x.font='800 46px '+F; x.fillText(ROUTES[k].name,225,y+74);
      x.font='600 32px '+F; x.fillStyle='#5A5A52'; x.fillText(ROUTES[k].line,225,y+126);
      y+=190;
    });
    x.fillStyle='#6B6657'; x.textAlign='center'; x.font='500 28px '+F;
    x.fillText('가상 상황으로 단순화한 게임입니다. 실제 구매 방식은 물품과 상황에 따라 다릅니다.',540,1290);
    var a=document.createElement('a'); a.download='미리도착한하루_도착표.png'; a.href=c.toDataURL('image/png');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){ say('카드를 저장하지 못했습니다. 화면을 캡처해 주세요.'); }
}
function rr(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

/* ---------- 반복 처리 ---------- */
function loop(ts){
  if(stage==='intro') introAuto(ts);
  if(stage==='rub' && cur){
    if(cur.resist){
      /* 색이 오래 가지 않는다: 문지르지 않으면 서서히 돌아간다 */
      var dt=1/60;
      for(var i=0;i<objs.length;i++){
        if(!objs[i].free && !DONE[i] && ts-lastRubAt>200 && P[i]>0){ P[i]=Math.max(0,P[i]-dt*0.45); applyOne(i); }
      }
      applyBg();
      var hint=$('#hint2');
      if(hint && hint.style.display==='none' && (resistRub>500 || ts-sceneStart>9000)){
        hint.style.display='block'; hint.textContent='색이 오래 가지 않아요. 그런데 왼쪽 창고는 왠지 닫혀 있네요.';
        caption('왼쪽 창고를 문질러 보세요'); ringsFor([0]); keepRing=true; say('색이 오래 가지 않아요. 왼쪽의 비축 창고를 문질러 보세요.');
      }
    }else if(ts-lastAct>5000 && !document.querySelector('.hintring')){
      var un=[]; for(var j=0;j<objs.length;j++){ if(!DONE[j]) un.push(j); } if(un.length) ringsFor(un);
    }
  }
  requestAnimationFrame(loop);
}

startIntro();
requestAnimationFrame(loop);
})();
</script>
